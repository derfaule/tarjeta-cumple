<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪩 Cumple Retro Gatuno 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sunburst-bg" aria-hidden="true"></div>

  <div class="bg-cats" id="bgCats" aria-hidden="true"></div>

  <div class="stickers-layer" aria-hidden="true">
    <span class="sticker sticker-star1">⭐</span>
    <span class="sticker sticker-heart1">💖</span>
    <span class="sticker sticker-cherry">🍒</span>
    <span class="sticker sticker-cupcake">🧁</span>
    <span class="sticker sticker-bow">🎀</span>
    <span class="sticker sticker-star2">✨</span>
    <span class="sticker sticker-cat1">🐈‍⬛</span>
    <span class="sticker sticker-moon">🌙</span>
    <span class="sticker sticker-lolly">🍭</span>
    <span class="sticker sticker-star3">🌟</span>
    <span class="sticker sticker-heart2">💗</span>
    <span class="sticker sticker-candle">🕯️</span>
  </div>

  <header class="hero">
    <div class="disco-frame">
      <div class="disco-ball" aria-hidden="true"></div>
      <span class="hero-cat">🐈‍⬛</span>
    </div>
    <h1 class="cutout-title hero-title" id="heroTitle">happy birthday</h1>
    <p class="hero-subtitle">Un plan paso a paso, tan retro y glamuroso como una bola de discoteca con gatitos negros 🪩🐾</p>
  </header>

  <main>
    <section class="bento-wrap">
      <h2 class="section-title">El Plan, Paso a Paso 🌈</h2>
      <div class="bento-grid" id="bentoGrid"></div>
    </section>

    <div class="detail-overlay" id="detailOverlay">
      <div class="detail-backdrop" id="detailBackdrop"></div>
      <div class="detail-card">
        <button class="detail-close" id="detailClose" aria-label="Cerrar">✕</button>
        <button class="detail-nav detail-prev" id="detailPrev" aria-label="Paso anterior">◀</button>
        <div class="photo-frame" id="detailPhotoFrame">
          <span class="washi-tape"></span>
          <img class="slide-img" id="detailImg" alt="">
        </div>
        <p class="slide-step-label" id="detailStepLabel"></p>
        <h3 class="cutout-title detail-title" id="detailTitle"></h3>
        <p class="detail-poem" id="detailPoem"></p>
        <div class="detail-links" id="detailLinks"></div>
        <button class="detail-nav detail-next" id="detailNext" aria-label="Paso siguiente">▶</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Hecho con 💖, purpurina y demasiados gatos negros</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
